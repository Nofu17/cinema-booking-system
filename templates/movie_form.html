{% extends 'base.html' %}
{% block title %}{{ action }}{% endblock %}
{% block content %}

<div class="page-top">
  <h1>{{ action }}</h1>
  <a href="{% url 'movie_list' %}" class="btn btn-dark">Back →</a>
</div>

<div class="card" style="max-width:580px">
<form method="post">{% csrf_token %}
  <div class="form-group"><label>Title</label>{{ form.title }}</div>
  <div class="grid2">
    <div class="form-group"><label>Genre</label>{{ form.genre }}</div>
    <div class="form-group"><label>Duration (min)</label>{{ form.duration }}</div>
  </div>
  <div class="form-group"><label>Description</label>{{ form.description }}</div>
  <div class="grid2">
    <div class="form-group"><label>Release Date</label>{{ form.release_date }}</div>
    <div class="form-group"><label>Rating (0–10)</label>{{ form.rating }}</div>
  </div>
  <div class="form-group">
    <div class="checkbox-row">{{ form.is_showing }}<label>Currently Showing</label></div>
  </div>
  <div style="display:flex;gap:.7rem;margin-top:1rem">
    <button type="submit" class="btn btn-red">💾 Save</button>
    <a href="{% url 'movie_list' %}" class="btn btn-dark">Cancel</a>
  </div>
</form>
</div>

{% endblock %}
