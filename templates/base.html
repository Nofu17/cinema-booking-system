<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cinema One{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh}

  nav{background:#111;border-bottom:2px solid #e50000;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:99}
  .brand{font-size:1.5rem;font-weight:700;color:#e50000;text-decoration:none;letter-spacing:2px}
  .brand span{color:#fff}
  .nav-links{display:flex;gap:.3rem}
  .nav-links a{color:#aaa;text-decoration:none;padding:.35rem .85rem;border-radius:6px;font-size:.85rem;transition:.2s}
  .nav-links a:hover{background:#1e1e1e;color:#fff}

  main{max-width:1050px;margin:2rem auto;padding:0 1.5rem}

  .page-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid #222}
  .page-top h1{font-size:1.6rem;font-weight:700}

  .card{background:#161616;border:1px solid #222;border-radius:12px;padding:1.4rem;margin-bottom:1rem}

  table{width:100%;border-collapse:collapse}
  th{background:#111;color:#888;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;padding:.65rem 1rem;text-align:left;border-bottom:1px solid #222}
  td{padding:.75rem 1rem;border-bottom:1px solid #1a1a1a;font-size:.88rem}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.02)}

  .btn{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem 1rem;border-radius:7px;border:none;cursor:pointer;font-size:.82rem;font-weight:600;text-decoration:none;font-family:'Poppins',sans-serif;transition:.2s}
  .btn-red{background:#e50000;color:#fff}.btn-red:hover{background:#c00}
  .btn-dark{background:#222;color:#f0f0f0;border:1px solid #333}.btn-dark:hover{border-color:#e50000;color:#e50000}
  .btn-orange{background:#e57300;color:#fff}.btn-orange:hover{background:#c56200}
  .btn-sm{padding:.28rem .65rem;font-size:.76rem}

  .badge{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase}
  .b-green{background:rgba(0,200,80,.12);color:#00c850}
  .b-red{background:rgba(220,0,0,.12);color:#ff4444}
  .b-yellow{background:rgba(255,180,0,.12);color:#ffb400}
  .b-blue{background:rgba(0,150,255,.12);color:#0096ff}

  .form-group{margin-bottom:1.1rem}
  label{display:block;color:#888;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.35rem}
  input,select,textarea{width:100%;padding:.55rem .85rem;background:#111;border:1px solid #2a2a2a;border-radius:7px;color:#f0f0f0;font-size:.88rem;font-family:'Poppins',sans-serif;transition:border .2s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#e50000}
  select option{background:#111}
  textarea{resize:vertical;min-height:90px}
  .checkbox-row{display:flex;align-items:center;gap:.6rem}
  .checkbox-row input{width:auto}
  .checkbox-row label{margin:0;text-transform:none;font-size:.88rem;color:#f0f0f0}

  .alert{padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.86rem;background:rgba(0,200,80,.08);border:1px solid rgba(0,200,80,.25);color:#00c850}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}

  .stat-box{background:#161616;border:1px solid #222;border-radius:12px;padding:1.5rem;text-align:center}
  .stat-num{font-size:2.4rem;font-weight:700;color:#e50000}
  .stat-label{color:#666;font-size:.8rem;text-transform:uppercase;margin-top:.3rem}

  .movie-card{background:#161616;border:1px solid #222;border-radius:12px;padding:1.2rem;transition:.2s}
  .movie-card:hover{border-color:#e50000}
  .genre{display:inline-block;padding:.15rem .5rem;background:rgba(229,0,0,.12);color:#e50000;border-radius:4px;font-size:.72rem;font-weight:700;text-transform:uppercase}
  .rating{color:#ffd700;font-size:.85rem}

  @media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.nav-links a{padding:.3rem .5rem;font-size:.78rem}}
</style>
</head>
<body>

<nav>
  <a href="{% url 'home' %}" class="brand">CINEMA<span>One</span></a>
  <div class="nav-links">
    <a href="{% url 'home' %}">🏠 Home</a>
    <a href="{% url 'movie_list' %}">🎬 Movies</a>
    <a href="{% url 'showtime_list' %}">🕐 Showtimes</a>
    <a href="{% url 'booking_list' %}">🎟 Bookings</a>
  </div>
</nav>

<main>
  {% if messages %}
    {% for msg in messages %}
      <div class="alert">✅ {{ msg }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
